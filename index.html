<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PRSTUDIOS — Philéas Renoult</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300;1,9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--void:#0A0910;--cream:#F2EAD6;--acid:#D8FF3A;--orange:#E8721A;
 --fat:'Archivo Black','Arial Black',sans-serif;
 --ser:'Fraunces',Georgia,serif;
 --mono:'Space Mono',ui-monospace,Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--void);color:var(--cream);font-family:var(--mono);
 -webkit-font-smoothing:antialiased;touch-action:none}
@media(pointer:fine){body{cursor:none} a,button{cursor:none}}
#gl{position:fixed;inset:0;display:block}
::selection{background:var(--cream);color:var(--void)}
#frame{position:fixed;inset:9px;z-index:8;pointer-events:none;
 border:1px solid rgba(242,234,214,.16)}
#frame i{position:absolute;width:11px;height:11px;border-color:rgba(242,234,214,.5);border-style:solid}
#frame .a{left:-1px;top:-1px;border-width:1px 0 0 1px}
#frame .b{right:-1px;top:-1px;border-width:1px 1px 0 0}
#frame .c{left:-1px;bottom:-1px;border-width:0 0 1px 1px}
#frame .d{right:-1px;bottom:-1px;border-width:0 1px 1px 0}
#grain{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.28;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
#vig{position:fixed;inset:0;z-index:6;pointer-events:none;
 background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 34%,rgba(0,0,0,.62) 100%)}
#cur{position:fixed;z-index:200;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
 background:var(--cream);pointer-events:none;mix-blend-mode:difference;
 transition:transform .22s cubic-bezier(.2,.9,.3,1.4)}
#cur.hot{transform:scale(2.6)}
#cur.dn{transform:scale(.6)}
#cur.hot.dn{transform:scale(2)}
@media(pointer:coarse){#cur{display:none}}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud>*{position:absolute}
.tl{left:22px;top:20px}
.tl .nm{font-family:var(--fat);font-size:clamp(13px,1.8vw,17px);letter-spacing:-.02em}
.tl .sb{font-family:var(--ser);font-style:italic;font-size:12.5px;
 color:rgba(242,234,214,.62);margin-top:4px;letter-spacing:.02em}
.tr{right:22px;top:20px;display:flex;gap:6px;pointer-events:auto;align-items:center}
.tr a,.tr button{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
 padding:6px 11px;border:1px solid rgba(242,234,214,.34);background:none;color:var(--cream);
 text-decoration:none}
.tr a:hover,.tr button:hover{background:var(--cream);color:var(--void)}
.tr button.on{border-color:var(--acid);color:var(--acid)}
.bl{left:22px;bottom:20px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
 color:rgba(242,234,214,.4);line-height:1.8;transition:opacity .9s}
.br{right:22px;bottom:20px;font-size:8.5px;letter-spacing:.1em;color:rgba(242,234,214,.32);
 text-align:right;line-height:1.7}
#vu{position:fixed;right:22px;bottom:50px;z-index:11;width:74px;height:3px;
 background:rgba(242,234,214,.14);pointer-events:none}
#vu i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acid)}
#score{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:11;
 text-align:center;pointer-events:none}
#score .ch{font-family:var(--ser);font-style:italic;font-weight:300;
 font-size:clamp(19px,2.6vw,27px);letter-spacing:.01em;color:rgba(242,234,214,.88);
 transition:opacity .5s}
#score .fn{font-family:var(--mono);font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;
 color:rgba(242,234,214,.4);margin-top:3px}
#score .form{display:flex;gap:7px;justify-content:center;margin-top:8px}
#score .form i{width:5px;height:5px;border-radius:50%;background:rgba(242,234,214,.2);
 transition:background .4s,transform .4s}
#score .form i.on{background:var(--acid);transform:scale(1.35)}
#card{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:18px;
 transform:translateY(108%);transition:transform .6s cubic-bezier(.2,.9,.25,1);pointer-events:none;
 display:flex;justify-content:center}
#card.on{transform:none;pointer-events:auto}
#card .stick{max-width:620px;width:100%;transform:rotate(-1.1deg);position:relative;
 filter:drop-shadow(7px 9px 0 rgba(0,0,0,.5))}
#card .in{background:#100E15;
 clip-path:polygon(0 3.5%,2.5% 0,97.8% .8%,100% 5%,99.4% 96%,96.5% 100%,1.8% 99%,.4% 94%);
 padding:0 0 18px}
#card .plate{padding:11px 18px 10px;display:flex;align-items:baseline;gap:12px;color:var(--void)}
#card .plate h2{font-family:var(--fat);font-size:clamp(17px,2.4vw,24px);line-height:1;
 letter-spacing:-.03em}
#card .plate .yr{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
 opacity:.75;margin-left:auto;white-space:nowrap}
#card .bd{display:flex;gap:16px;padding:14px 18px 0;align-items:flex-start}
#card .txt{flex:1;min-width:0}
#card .snd{font-family:var(--ser);font-style:italic;font-size:13px;opacity:.95}
#card p{font-size:11.5px;line-height:1.62;margin-top:9px;color:rgba(242,234,214,.85)}
#card img{width:158px;flex:0 0 auto;aspect-ratio:16/9;object-fit:cover;display:block;
 filter:contrast(1.1) saturate(1.05);clip-path:polygon(0 4%,3% 0,100% 2%,98% 97%,95% 100%,1% 98%)}
#card .row{display:flex;gap:8px;margin-top:13px;align-items:center}
#card a.cta{font-size:9px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;
 padding:8px 15px;background:currentColor}
#card a.cta b{color:var(--void)}
#card .x{margin-left:auto;font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:none;
 border:1px solid rgba(242,234,214,.4);color:var(--cream);padding:7px 11px}
#card .x:hover{background:var(--cream);color:var(--void)}
#gate{position:fixed;inset:0;z-index:60;background:var(--void);display:grid;
 place-items:center;padding:24px;transition:opacity 1.1s ease}
#gate.gone{opacity:0;pointer-events:none}
#gate .in{text-align:center;max-width:min(88vw,520px)}
#gate svg{width:34px;display:block;margin:0 auto 30px;opacity:.9}
#gate h1{font-family:var(--ser);font-style:italic;font-weight:300;
 font-size:clamp(30px,6.4vw,58px);line-height:1.04;letter-spacing:-.015em;
 color:var(--cream)}
#gate h1 em{font-style:normal;font-family:var(--fat);letter-spacing:-.04em;
 font-size:.86em;color:var(--orange)}
#gate .sub{font-size:9px;letter-spacing:.34em;text-transform:uppercase;
 color:rgba(242,234,214,.34);margin-top:22px}
/* le bouton : un seul, un anneau qui respire */
#enter{position:relative;display:inline-grid;place-items:center;
 width:132px;height:132px;margin-top:44px;border-radius:50%;
 background:none;border:none;color:var(--cream);font-family:var(--mono);
 font-size:9px;letter-spacing:.3em;text-transform:uppercase}
#enter span{position:relative;z-index:2;transition:color .5s}
#enter::before,#enter::after{content:'';position:absolute;inset:0;
 border-radius:50%;border:1px solid rgba(242,234,214,.3);
 transition:transform .8s cubic-bezier(.2,.9,.25,1),border-color .5s,opacity .8s}
#enter::after{animation:ring 3.6s ease-out infinite;opacity:0}
@keyframes ring{
  0%{transform:scale(.82);opacity:0}
  22%{opacity:.5}
  100%{transform:scale(1.5);opacity:0}}
#enter:hover::before{transform:scale(1.1);border-color:var(--cream)}
#enter:hover span{color:var(--acid)}
#enter:active::before{transform:scale(.94)}
@media(max-width:640px){
  #card .bd{flex-direction:column}
  #card img{width:100%}
  .br,#vu{display:none}
  #score .ch{font-size:16px}
}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="grain"></div>
<div id="vig"></div>
<div id="frame"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
<div id="cur"></div>

<div id="hud">
  <div class="tl"><div class="nm">PRSTUDIOS</div>
    <div class="sb">Philéas Renoult — score &amp; sound design</div></div>
  <div class="tr">
    <a href="mailto:prstudios.works@gmail.com">Hire</a>
    <button id="eng">Sound</button>
  </div>
  <div class="bl" id="hint">drag to orbit · scroll to move in<br>tap a piece to open it</div>
  <div class="br" id="sys">—</div>
</div>
<div id="score" style="opacity:0;transition:opacity 1s">
  <div class="ch">—</div><div class="fn">—</div>
  <div class="form"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>
<div id="vu"><i></i></div>

<div id="card"><div class="stick"><div class="in">
  <div class="plate"><h2></h2><span class="yr"></span></div>
  <div class="bd">
    <div class="txt">
      <div class="snd"></div><p></p>
      <div class="row"><a class="cta" target="_blank" rel="noopener"><b></b></a>
      <button class="x" type="button">Close</button></div>
    </div>
  </div>
</div></div></div>

<div id="gate"><div class="in">
  <svg viewBox="0 0 100 100" id="gstar"></svg>
  <h1>A room full<br>of <em>PIECES</em></h1>
  <div class="sub">Philéas Renoult — score &amp; sound design</div>
  <button id="enter" type="button"><span>Enter</span></button>
</div></div>

<script>
(function(){
"use strict";
if(!window.THREE){document.getElementById('gate').innerHTML=
  '<div class="in"><h1>WebGL unavailable</h1></div>';return;}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

const K={void:'#0A0910',cream:'#F2EAD6',rust:'#B7291B',orange:'#E8721A',coral:'#E4795A',
        olive:'#A9A340',teal:'#2C7383',navy:'#22346B',amber:'#E3A72A',ice:'#BFD3D8',
        acid:'#D8FF3A',red:'#E02010',pink:'#E8386E',cyan:'#3BB8D8'};
function rnd(s){let x=s*9301+49297;return function(){x=(x*9301+49297)%233280;return x/233280;};}
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c;}
function tex(c){const t=new THREE.CanvasTexture(c);t.anisotropy=4;t.needsUpdate=true;return t;}
function pick1(a){return a[Math.floor(Math.random()*a.length)];}

/* ============ TEXTURES ============ */
function starPts(g,pts,ro,ri,rot,cx,cy){
  g.beginPath();
  for(let i=0;i<pts*2;i++){
    const r=i%2?ri:ro,a=(i/(pts*2))*6.283+rot;
    const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
    if(i)g.lineTo(px,py);else g.moveTo(px,py);
  }
  g.closePath();
}
function texStar(pts,ro,ri,fill,edge,dot){
  const S=512,c=cnv(S),g=c.getContext('2d');
  g.clearRect(0,0,S,S);
  starPts(g,pts,ro*S/100,ri*S/100,-0.35,S/2,S/2);
  g.lineJoin='round';g.lineWidth=S*0.055;g.strokeStyle=edge;g.stroke();
  g.fillStyle=fill;g.fill();
  if(dot){g.beginPath();g.arc(S/2,S/2,S*0.09,0,6.283);g.fillStyle=dot;g.fill();}
  g.globalAlpha=.08;g.fillStyle='#000';
  const r=rnd(9);for(let i=0;i<900;i++)g.fillRect(r()*S,r()*S,2,2);
  return tex(c);
}
function texStripes(seed,cols){
  const S=512,c=cnv(S),g=c.getContext('2d');
  const r=rnd(seed);let y=0;
  g.fillStyle=K.cream;g.fillRect(0,0,S,S);
  while(y<S){
    const t=2+Math.pow(r(),2.1)*26;
    g.fillStyle=cols[Math.floor(r()*cols.length)];
    g.globalAlpha=.72+r()*.28;g.fillRect(0,y,S,t);y+=t+1;
  }
  g.globalAlpha=.07;g.fillStyle='#000';
  for(let i=0;i<1400;i++)g.fillRect(r()*S,r()*S,2,2);
  return tex(c);
}
function texBlock(){
  const S=512,c=cnv(S),g=c.getContext('2d');
  g.fillStyle='#EDEAE2';g.fillRect(0,0,S,S);
  const r=rnd(21);
  for(let y=4;y<S;y+=7)for(let x=4;x<S;x+=7){
    const v=(Math.sin(x*.021)*Math.cos(y*.017)+Math.sin((x+y)*.009))*.5+.5;
    const rad=v*3.3;
    if(rad>.4){g.beginPath();g.arc(x,y,rad,0,6.283);g.fillStyle='#14120F';g.fill();}
  }
  g.fillStyle=K.red;
  g.beginPath();g.moveTo(S*.20,S*.14);g.lineTo(S*.79,S*.19);
  g.lineTo(S*.77,S*.72);g.lineTo(S*.22,S*.69);g.closePath();g.fill();
  g.globalAlpha=.06;g.fillStyle='#000';
  for(let i=0;i<1000;i++)g.fillRect(r()*S,r()*S,2,2);
  return tex(c);
}
function drawWalker(g,S,ph,col,soft){
  const cx=S*.46,gr=S*.88,s=S/512;
  const sw=Math.sin(ph),sw2=Math.sin(ph+Math.PI);
  const bob=Math.abs(Math.sin(ph*2))*10*s;
  const hip=gr-150*s-bob,sh=hip-140*s,hd=sh-40*s;
  g.strokeStyle=col;g.fillStyle=col;g.lineCap='round';g.lineJoin='round';
  if(soft){g.shadowColor=col;g.shadowBlur=S*0.045;}
  g.lineWidth=44*s;
  g.beginPath();g.moveTo(cx,hip);g.lineTo(cx+30*s,sh);g.stroke();
  g.lineWidth=34*s;
  [sw,sw2].forEach(function(v){
    const kx=cx+v*70*s, ky=gr-72*s-bob*.4;
    const fx=kx+v*46*s, fy=gr-Math.max(0,v)*26*s;
    g.beginPath();g.moveTo(cx,hip);g.lineTo(kx,ky);g.lineTo(fx,fy);g.stroke();
    g.lineWidth=20*s;
    g.beginPath();g.moveTo(fx,fy);g.lineTo(fx+22*s,fy+3*s);g.stroke();
    g.lineWidth=34*s;
  });
  g.lineWidth=24*s;
  [sw2,sw].forEach(function(v){
    const ex=cx+30*s+v*44*s, ey=sh+70*s;
    const hx=ex+v*36*s, hy=ey+56*s;
    g.beginPath();g.moveTo(cx+30*s,sh);g.lineTo(ex,ey);g.lineTo(hx,hy);g.stroke();
  });
  g.beginPath();g.arc(cx+42*s,hd,34*s,0,6.283);g.fill();
  g.lineWidth=14*s;
  g.beginPath();g.moveTo(cx-12*s,hd-24*s);g.lineTo(cx+100*s,hd-30*s);g.stroke();
  g.beginPath();g.ellipse(cx+46*s,hd-46*s,32*s,25*s,-.12,0,6.283);g.fill();
  g.shadowBlur=0;
}
function texWalker(ph,col,soft){
  const S=512,c=cnv(S),g=c.getContext('2d');
  g.clearRect(0,0,S,S);
  drawWalker(g,S,ph===undefined?0:ph,col||'#0C0B0A',soft);
  return tex(c);
}
function texChalk(){
  const S=512,c=cnv(S),g=c.getContext('2d');
  g.fillStyle='#141110';g.fillRect(0,0,S,S);
  const cols=[K.red,K.orange,K.cyan,K.acid,K.pink,K.amber,K.cream],r=rnd(41);
  for(let k=0;k<34;k++){
    const x0=r()*S,y0=r()*S,col=cols[Math.floor(r()*cols.length)];
    const steps=8+Math.floor(r()*14),amp=6+r()*40,len=40+r()*200;
    for(let pass=0;pass<2;pass++){
      g.beginPath();
      for(let i=0;i<=steps;i++){
        const t=i/steps,x=x0+t*len,y=y0+Math.sin(t*8+k)*amp;
        if(i)g.lineTo(x+(Math.random()-.5)*3,y+(Math.random()-.5)*3);else g.moveTo(x,y);
      }
      g.strokeStyle=col;g.globalAlpha=pass?.13:.42;
      g.lineWidth=pass?5:1.9;g.lineCap='round';g.stroke();
    }
  }
  g.globalAlpha=1;
  starPts(g,8,S*.10,S*.035,.3,S*.76,S*.24);g.fillStyle=K.amber;g.fill();
  starPts(g,5,S*.08,S*.03,-.4,S*.22,S*.78);g.fillStyle=K.acid;g.fill();
  return tex(c);
}
function texHalfYellow(){
  const S=512,c=cnv(S),g=c.getContext('2d');
  g.fillStyle='#E8CE1E';g.fillRect(0,0,S,S);
  for(let y=3;y<S;y+=6)for(let x=3;x<S;x+=6){
    const d=Math.hypot(x-S*.5,y-S*.56)/(S*.5);
    const v=Math.max(0,1-d)*(.5+.5*Math.sin(x*.03)*Math.cos(y*.024));
    const rad=v*3.6;
    if(rad>.4){g.beginPath();g.arc(x,y,rad,0,6.283);g.fillStyle='#141008';g.fill();}
  }
  return tex(c);
}
function texLabel(txt,sub,col){
  const W=512,H=150,c=cnv(W,H),g=c.getContext('2d');
  g.clearRect(0,0,W,H);
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle=col;g.font='45px "Archivo Black",sans-serif';
  g.fillText(txt,W/2,H*0.33);
  const tw=Math.min(W-40,g.measureText(sub).width+46);
  g.fillStyle=col;g.globalAlpha=.92;
  g.beginPath();
  g.moveTo(W/2-tw/2,H*.62);g.lineTo(W/2+tw/2,H*.60);
  g.lineTo(W/2+tw/2-6,H*.88);g.lineTo(W/2-tw/2+5,H*.9);
  g.closePath();g.fill();
  g.globalAlpha=1;
  g.fillStyle='#0A0910';g.font='19px "Space Mono",monospace';
  g.fillText(sub,W/2,H*0.755);
  return tex(c);
}
const WORDS=['SOUND','SCORE','MIX','TAKE 1','TAKE 2','GVA','PARIS','LDN','440Hz',
             'TEMPO','REC','CUE','STEM','ROOM','DRY','WET','PRSTUDIOS','LOOP','BUS'];
function crown(g,x,y,w,col,lw){
  g.strokeStyle=col;g.lineWidth=lw;g.lineJoin='round';g.lineCap='round';
  g.beginPath();
  g.moveTo(x-w,y+w*.55);g.lineTo(x-w*.72,y-w*.5);g.lineTo(x-w*.34,y+w*.14);
  g.lineTo(x,y-w*.62);g.lineTo(x+w*.34,y+w*.14);g.lineTo(x+w*.72,y-w*.5);
  g.lineTo(x+w,y+w*.55);g.stroke();
}
function scrawlWord(g,x,y,txt,col,size,strike){
  g.save();g.translate(x,y);g.rotate((Math.random()-.5)*.18);
  g.font=size+'px "Archivo Black",sans-serif';
  g.textAlign='left';g.textBaseline='alphabetic';
  g.fillStyle=col;g.globalAlpha=.85;g.fillText(txt,0,0);
  const w=g.measureText(txt).width;
  if(strike){
    g.strokeStyle=col;g.lineWidth=size*.13;g.globalAlpha=.75;
    g.beginPath();
    g.moveTo(-size*.1,-size*.32+(Math.random()-.5)*4);
    g.lineTo(w+size*.1,-size*.3+(Math.random()-.5)*4);
    g.stroke();
  }
  g.restore();
}
function drips(g,x,y,w,col,n){
  g.strokeStyle=col;g.lineCap='round';
  for(let i=0;i<n;i++){
    const dx=x+(Math.random()-.5)*w;
    g.lineWidth=1+Math.random()*3;g.globalAlpha=.5;
    g.beginPath();g.moveTo(dx,y);g.lineTo(dx+(Math.random()-.5)*6,y+8+Math.random()*46);g.stroke();
  }
  g.globalAlpha=1;
}
function texWall(seed){
  const S=1024,c=cnv(S),g=c.getContext('2d');
  const r=rnd(seed);
  g.fillStyle='#100E12';g.fillRect(0,0,S,S);
  const smear=[K.rust,K.navy,K.teal,'#2A1810','#1A1D33'];
  for(let i=0;i<26;i++){
    g.globalAlpha=.16+r()*.2;
    g.fillStyle=smear[Math.floor(r()*smear.length)];
    const w=S*(.12+r()*.4),h=S*(.06+r()*.22);
    g.save();g.translate(r()*S,r()*S);g.rotate((r()-.5)*.5);
    g.fillRect(-w/2,-h/2,w,h);g.restore();
  }
  g.globalAlpha=1;
  for(let k=0;k<9;k++){
    const x0=r()*S,y0=r()*S,col=pick1([K.cream,K.acid,K.coral,K.cyan]);
    g.strokeStyle=col;g.globalAlpha=.2+r()*.22;g.lineWidth=1.3+r()*1.6;

  taps.forEach(function(t){t.f.connect(wet);});
  wet.connect(wetTone);wetTone.connect(out);

  motion.src=AC.createBufferSource();motion.src.buffer=NB;motion.src.loop=true;
  motion.bp=AC.createBiquadFilter();motion.bp.type='bandpass';
  motion.bp.frequency.value=300;motion.bp.Q.value=.6;
  motion.lp=AC.createBiquadFilter();motion.lp.type='lowpass';
  motion.lp.frequency.value=1200;
  motion.g=AC.createGain();motion.g.gain.value=0;
  motion.src.connect(motion.bp);motion.bp.connect(motion.lp);
  motion.lp.connect(motion.g);
  motion.g.connect(busUI);motion.g.connect(verbIn);motion.src.start();

  const rs=AC.createBufferSource();rs.buffer=NB;rs.loop=true;
  const rf=AC.createBiquadFilter();rf.type='lowpass';rf.frequency.value=140;rf.Q.value=.4;
  const rg=AC.createGain();rg.gain.value=.035;
  rs.connect(rf);rf.connect(rg);rg.connect(out);rs.start();

  PIECE.forEach(function(p){
    const pan=AC.createPanner();
    pan.panningModel='HRTF';pan.distanceModel='inverse';
    pan.refDistance=6;pan.maxDistance=90;pan.rolloffFactor=1.1;
    const tone=AC.createBiquadFilter();
    tone.type='lowpass';tone.frequency.value=4800;tone.Q.value=.4;
    const g=AC.createGain();g.gain.value=1;
    const send=AC.createGain();send.gain.value=.28;
    g.connect(tone);tone.connect(pan);
    pan.connect(busWorld);pan.connect(send);send.connect(verbIn);
    p._g=g;p._pan=pan;p._send=send;
  });
  WALKERS.forEach(function(w){
    const pan=AC.createPanner();
    pan.panningModel='HRTF';pan.distanceModel='inverse';
    pan.refDistance=14;pan.maxDistance=120;pan.rolloffFactor=1.4;
    const g=AC.createGain();g.gain.value=1;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;
    g.connect(lp);lp.connect(pan);pan.connect(busWorld);
    const snd=AC.createGain();snd.gain.value=.5;pan.connect(snd);snd.connect(verbIn);
    w.userData.g=g;w.userData.pan=pan;
  });
  out.gain.linearRampToValueAtTime(.85,AC.currentTime+2.2);
  document.getElementById('sys').textContent=
    (AC.sampleRate/1000).toFixed(1)+' kHz \u00b7 HRTF \u00b7 B\u266dm \u00b7 5 movements';
}
/* enveloppes : attaques adoucies, jamais de rampe plus courte que 6 ms
   (une attaque plus rapide produit un clic large bande) */
function env(g,t,a,pk,d,curve){
  const A=Math.max(.006,a);
  g.gain.setValueAtTime(0.0001,t);
  if(curve==='lin')g.gain.linearRampToValueAtTime(pk,t+A);
  else g.gain.exponentialRampToValueAtTime(Math.max(.0002,pk),t+A);
  g.gain.setTargetAtTime(.0001,t+A,Math.max(.12,d*0.34));
}
/* contrebasse : corps + une octave, bruit d'archet retire */
function upright(f,o){
  if(!AC||!eng)return;o=o||{};
  if(!take(2,(o.dur||3.6)+1))return;
  const t=AC.currentTime+(o.at||0),dur=o.dur||3.6;
  const bus=AC.createGain();
  [[1,1],[2,.14],[3,.04]].forEach(function(q){
    const osc=AC.createOscillator();osc.type='sine';
    osc.frequency.value=f*q[0];osc.detune.value=(Math.random()-.5)*2;
    const g=AC.createGain();env(g,t,.075,(o.gain||.15)*q[1],dur);
    osc.connect(g);g.connect(bus);osc.start(t);osc.stop(t+dur+1.4);
  });
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=620;lp.Q.value=.4;
  bus.connect(lp);lp.connect(o.dest||busUI);
}
/* piano feutre : partiels legerement etires comme une vraie corde,
   filtre qui se ferme, attaque de 25 ms — du feutre, pas du marteau */
function felt(f,o){
  if(!AC||!eng)return;o=o||{};
  if(!take(3,(o.dur||4.2)+1))return;
  const t=AC.currentTime+(o.at||0),dur=o.dur||4.2,pk=(o.gain||.08)*.85;
  const bus=AC.createGain();
  [[1,1],[2.0008,.19],[3.0025,.06],[4.006,.022]].forEach(function(q){
    const osc=AC.createOscillator();osc.type='sine';
    osc.frequency.value=f*q[0];osc.detune.value=(Math.random()-.5)*2.4;
    const g=AC.createGain(),dd=dur*(q[0]>2.5?.32:1);
    env(g,t,.025+q[0]*.004,pk*q[1],dd);
    osc.connect(g);g.connect(bus);osc.start(t);osc.stop(t+dd+1.2);
  });
  const flt=AC.createBiquadFilter();flt.type='lowpass';
  flt.frequency.setValueAtTime(Math.min(o.cut||1900,2100),t);
  flt.frequency.exponentialRampToValueAtTime(430,t+dur*.8);
  flt.Q.value=.35;
  bus.connect(flt);flt.connect(o.dest||busUI);
}
/* accord plaque : les notes du bas legerement en avance et plus douces */
function blockChord(freqs,o){
  o=o||{};
  const n=freqs.length;
  freqs.forEach(function(f,i){
    felt(f,{at:(o.at||0)+(n-1-i)*.016,
      gain:(o.gain||.07)*(i===0?1.15:0.72-i*0.04),
      dur:o.dur||1.8,cut:Math.min(o.cut||1900,1900),dest:o.dest});
  });
}
/* corde pincee : excitation adoucie (rampe, pas de creneau) et
   amortissement bien plus bas — c'etait une source de durete */
function pluckRaw(f,o){
  if(!AC||!eng)return;o=o||{};
  if(!take(2,(o.dur||1.6)+1))return;
  const t=AC.currentTime+(o.at||0),dur=o.dur||1.6;
  const d=AC.createDelay(.2);d.delayTime.value=1/f;
  const lp=AC.createBiquadFilter();lp.type='lowpass';
  lp.frequency.value=Math.min(o.damp||1500,1700);lp.Q.value=.4;
  const fb=AC.createGain();fb.gain.setValueAtTime(o.fb===undefined?.955:o.fb,t);
  fb.gain.linearRampToValueAtTime(0,t+dur);
  const og=AC.createGain();og.gain.value=(o.gain||.1)*.9;
  d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(og);
  const n=AC.createBufferSource();n.buffer=NB;
  const nf=AC.createBiquadFilter();nf.type='lowpass';nf.frequency.value=1900;
  const ng=AC.createGain();
  ng.gain.setValueAtTime(.0001,t);
  ng.gain.linearRampToValueAtTime(o.pick||.55,t+.004);
  ng.gain.exponentialRampToValueAtTime(.001,t+(o.exc||.018));
  n.connect(nf);nf.connect(ng);ng.connect(d);
  const body=AC.createBiquadFilter();body.type='lowpass';
  body.frequency.value=2000;body.Q.value=.4;
  og.connect(body);body.connect(o.dest||busUI);
  n.start(t);n.stop(t+.06);
  setTimeout(function(){try{og.disconnect();d.disconnect();lp.disconnect();
    fb.disconnect();body.disconnect();}catch(e){}},(dur+.6)*1000);
}
/* octaves Wes : l'octave grave porte, l'aigue effleure */
function wes(f,o){
  o=o||{};
  pluckRaw(f/2,{at:o.at,gain:(o.gain||.09)*1.1,dur:o.dur||1.5,damp:1250,dest:o.dest});
  pluckRaw(f,{at:(o.at||0)+.011,gain:(o.gain||.09)*.55,dur:(o.dur||1.5)*.9,
    damp:1600,dest:o.dest});
}
function chordMelody(top,voicing,o){
  o=o||{};
  voicing.forEach(function(f,i){
    pluckRaw(f,{at:(o.at||0)+i*.018,gain:(o.gain||.07)*.5,dur:o.dur||2,
      damp:1400,dest:o.dest});
  });
  wes(top,{at:(o.at||0)+voicing.length*.018+.02,gain:(o.gain||.07)*1.1,
    dur:(o.dur||2)*1.2,dest:o.dest});
}
/* cuivres bouches : entree tres lente, sortie tres lente, plafond bas */
function horns(fs,o){
  if(!AC||!eng)return;o=o||{};
  if(!take(fs.length*2,(o.dur||6)+1))return;
  const t=AC.currentTime+(o.at||0),dur=o.dur||6;
  fs.forEach(function(f,i){
    const bus=AC.createGain();
    [-3.5,3.5].forEach(function(dt2){
      const osc=AC.createOscillator();osc.type='sine';
      osc.frequency.setValueAtTime(f,t+i*.55);
      if(o.glideTo&&o.glideTo[i])
        osc.frequency.linearRampToValueAtTime(o.glideTo[i],t+i*.55+(o.glideAt||dur*.7));
      osc.detune.value=dt2;
      const g=AC.createGain();
      g.gain.setValueAtTime(.0001,t+i*.55);
      g.gain.linearRampToValueAtTime((o.gain||.045)*.9,t+i*.55+dur*.42);
      g.gain.linearRampToValueAtTime(.0001,t+i*.55+dur);
      osc.connect(g);g.connect(bus);
      osc.start(t+i*.55);osc.stop(t+i*.55+dur+.4);
    });
    const lp=AC.createBiquadFilter();lp.type='lowpass';
    lp.frequency.value=980;lp.Q.value=.4;
    bus.connect(lp);lp.connect(o.dest||busUI);
  });
}
/* celesta : le 4e partiel etait la source du "piquant" — divise par 3
   et filtre. Une cloche douce, pas un triangle. */
function celeste(f,o){
  if(!AC||!eng)return;o=o||{};
  if(!take(2,(o.dur||3)+1))return;
  const t=AC.currentTime+(o.at||0),dur=o.dur||3;
  const bus=AC.createGain();
  [[1,1],[2,.10],[3.98,.035]].forEach(function(q){
    const osc=AC.createOscillator();osc.type='sine';osc.frequency.value=f*q[0];
    const g=AC.createGain();
    env(g,t,.014,(o.gain||.06)*q[1]*.85,dur*(q[0]>2?.28:1));
    osc.connect(g);g.connect(bus);osc.start(t);osc.stop(t+dur+1);
  });
  const lp=AC.createBiquadFilter();lp.type='lowpass';
  lp.frequency.value=2700;lp.Q.value=.4;
  bus.connect(lp);lp.connect(o.dest||busUI);
}
/* balai : un frottement grave et long. L'ancien etait un sifflement
   a 1,8 kHz avec Q resonant — c'etait une des sources de douleur. */
function brush(o){
  if(!AC||!eng)return;o=o||{};
  if(!take(1,.6))return;
  const t=AC.currentTime+(o.at||0),dur=o.dur||.22;
  const n=AC.createBufferSource();n.buffer=NB;
  const bp=AC.createBiquadFilter();bp.type='bandpass';
  bp.frequency.setValueAtTime(Math.min(o.f||820,900),t);
  bp.frequency.exponentialRampToValueAtTime(340,t+dur);
  bp.Q.value=.55;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime((o.gain||.04)*.8,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  n.connect(bp);bp.connect(lp);lp.connect(g);g.connect(o.dest||busUI);
  n.start(t);n.stop(t+dur+.15);
}
/* l'ancien tick() etait un bruit resonant a 4600-5200 Hz : supprime.
   Remplace par une petite frappe de bois, sourde et courte. */
function tick(o){
  if(!AC||!eng)return;o=o||{};
  if(!take(1,.5))return;
  const t=AC.currentTime+(o.at||0);
  const osc=AC.createOscillator();osc.type='sine';
  osc.frequency.setValueAtTime(Math.min(o.f||280,340),t);
  osc.frequency.exponentialRampToValueAtTime(150,t+.05);
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime((o.gain||.05)*.55,t+.006);
  g.gain.exponentialRampToValueAtTime(.0001,t+.11);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
  osc.connect(g);g.connect(lp);lp.connect(o.dest||busUI);
  osc.start(t);osc.stop(t+.25);
}
function wood(o){
  if(!AC||!eng)return;o=o||{};
  if(!take(1,.5))return;
  const t=AC.currentTime+(o.at||0);
  const osc=AC.createOscillator();osc.type='sine';
  osc.frequency.setValueAtTime(o.f||140,t);
  osc.frequency.exponentialRampToValueAtTime((o.f||140)*.62,t+.1);
  const g=AC.createGain();env(g,t,.008,(o.gain||.07)*.8,.16);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;
  osc.connect(g);g.connect(lp);lp.connect(o.dest||busUI);
  osc.start(t);osc.stop(t+.5);
}
function footstep(dest,gain){
  if(!AC||!eng)return;
  if(!take(1,.5))return;
  const t=AC.currentTime;
  const osc=AC.createOscillator();osc.type='sine';
  osc.frequency.setValueAtTime(88+Math.random()*14,t);
  osc.frequency.exponentialRampToValueAtTime(44,t+.1);
  const g=AC.createGain();env(g,t,.008,gain*.8,.16);
  osc.connect(g);g.connect(dest);osc.start(t);osc.stop(t+.5);
}

/* ============================================================
   LA PARTITION — cinq mouvements through-composed, ~3 min 20,
   puis reprise variée (registre, densité, points de départ).
   ============================================================ */
const SCH=[];
function at(sec,fn){SCH.push(setTimeout(function(){if(AC&&eng)fn();},sec*1000));}
function rub(base){return base*(0.94+Math.random()*0.12);}          /* rubato léger */
function playLine(t0,line,voice,gain,harmonizeLast,dest){
  let t=t0;
  line.forEach(function(nd,i){
    const f=nd[0],d=nd[1];
    at(t,function(){
      if(harmonizeLast&&i===line.length-1)chordMelody(f,NOW.v,{gain:gain*1.05,dur:d+1,dest:dest});
      else voice(f,{gain:gain,dur:Math.max(1.2,d+.6),dest:dest});
    });
    t+=rub(d);
  });
  return t;
}

  for(let k=0;k<8;k++){
    at(o+k*1.9,function(){

  at(o+.2,function(){setNow(V.Equartal,'IV — new color',3,NF.E5,NF.E5);
    blockChord([NF.D5,NF.A4,NF.E4],{gain:.075,dur:2.2,cut:2400,dest:P()});fl('comp');});
  /* montée pentatonique rapide, célesta doublée Wes */
  at(o+2.6,function(){
    EPENT.slice(0,5).forEach(function(f,i){
      celeste(f,{at:i*.26,gain:.042,dur:2.2,dest:C()});
    });
    wes(NF.B4,{at:.9,gain:.07,dur:2.2,dest:W()});fl('bell');fl('answer');});
  at(o+4.1,function(){
    blockChord([NF.B4,NF.Gb4,NF.E4],{gain:.066,dur:2.6,cut:1800,dest:P()});fl('comp');});
  at(o+5.2,function(){horns([NF.Ab3,NF.E4],{gain:.04,dur:8,dest:H()});fl('pad');});
  at(o+8.1,function(){
    blockChord([NF.D5,NF.A4,NF.Gb4],{gain:.062,dur:2.6,cut:1800,dest:P()});fl('comp');});
  /* descente pentatonique en écho */
  at(o+9.3,function(){
    EPENT.slice(1,7).reverse().forEach(function(f,i){

    });fl('bell');});
  at(o+11.2,function(){
    blockChord([NF.D5,NF.A4,NF.E4],{gain:.07,dur:2.6,cut:2300,dest:P()});
    wes(NF.B4,{at:.6,gain:.07,dur:1.8,dest:W()});fl('comp');fl('answer');});
  at(o+13.4,function(){

    fl('bass');fl('comp');fl('pad');});
  at(o+23.4,function(){setNow(V.Dbmaj9,'IV — arrival',3,NF.Eb5,NF.Eb5);
    upright(NF.Db2,{gain:.15,dur:5.5,dest:B()});

/* ---------- V · HOME (146 – 192 s) — le thème harmonisé, cadence finale, coda 6/9 ---------- */

  at(o+17.5,function(){setNow(V.Gh7,'V — final cadences',4,NF.Ab4,NF.Db5);
    upright(NF.G2,{gain:.12,dur:2.4,dest:B()});
    V.Gh7.v.forEach(function(f,i){felt(f,{at:.25+i*.05,gain:.06,dur:2.8,cut:1900,dest:P()});});

  at(o+19.9,function(){setNow(V.C7alt,'V — final cadences',4,NF.Ab4,NF.Db5);

    brush({f:850,gain:.036,dur:.2,dest:D()});fl('bass');fl('comp');fl('perc');});
  /* L'ARRIVÉE : approche chromatique et la maison */
  at(o+25.4,function(){upright(NF.B1,{gain:.09,dur:.8,dest:B()});fl('bass',.7);});
  at(o+26.2,function(){setNow(V.Bbm9,'V — home',4,NF.F4,NF.C5);
    upright(NF.Bb1,{gain:.17,dur:6.5,dest:B()});
    V.Bbm9.v.forEach(function(f,i){felt(f,{at:.15+i*.05,gain:.075,dur:6,cut:2200,dest:P()});});
    fl('bass');fl('comp');});
  at(o+27.4,function(){fl('answer');});
  playLine(o+27.4,[[NF.Db5,.5],[NF.C5,.4],[NF.Ab4,.6],[NF.F4,1.6]],wes,.08,false,W());
  at(o+31.4,function(){celeste(NF.C5,{gain:.05,dur:3.6,dest:C()});fl('bell');});
  /* CODA — 6/9, la lumière douce, tout s'éteint */
  at(o+34,function(){setNow(V.Bbm69,'coda — 6/9',5,NF.G4,NF.F5);
    upright(NF.Bb1,{gain:.13,dur:8,dest:B()});
    V.Bbm69.v.forEach(function(f,i){felt(f,{at:.4+i*.24,gain:.06,dur:8,cut:1800,dest:P()});});
    fl('bass');fl('comp');});
  at(o+37.5,function(){horns([NF.Db4,NF.Ab4],{gain:.032,dur:8,dest:H()});fl('pad');});
  at(o+39.5,function(){celeste(NF.F5,{gain:.045,dur:5,dest:C()});fl('bell');});
  at(o+42,function(){brush({f:680,gain:.024,dur:.3,dest:D()});fl('perc',.5);});

const motion={src:null,bp:null,lp:null,g:null};
function updateMotion(spin,zoomV){
  if(!AC||!motion.g)return;
  const t=AC.currentTime;
  motion.g.gain.setTargetAtTime(eng?Math.min(.05,spin*1.4+Math.abs(zoomV)*.05):0,t,.14);
  motion.bp.frequency.setTargetAtTime(230+spin*900+Math.abs(zoomV)*90,t,.18);
}
function sGrab(){wood({f:130,gain:.07});}
function sRelease(spin){if(spin>.02)brush({f:620,gain:.026,dur:.3});}
/* les gestes s'accordent à NOW — toujours dans l'harmonie du moment */
function sHover(p){
  const d=p._g||busUI;
  tick({f:260,gain:.035});
  if(p.role==='bass')upright(NOW.b,{gain:.09,dur:2.2,dest:d});
  else if(p.role==='comp')NOW.g.forEach(function(f,i){
    felt(f,{at:i*.05,gain:.05,dur:2.4,cut:2000,dest:d});});
  else if(p.role==='answer')wes(NOW.top,{gain:.06,dur:1.4,dest:d});
  else if(p.role==='perc')brush({f:820,gain:.036,dur:.22,dest:d});
  else if(p.role==='pad')horns([NOW.g[0]],{gain:.035,dur:2.6,dest:d});
  else celeste(NOW.bell,{gain:.045,dur:2.4,dest:d});
}
function sSelect(p){
  tick({f:300,gain:.045});
  upright(NOW.b,{gain:.12,dur:3.2,dest:BYROLE.bass._g});
  NOW.v.forEach(function(f,i){
    felt(f,{at:.18+i*.08,gain:.065,dur:3.8,cut:2100,dest:BYROLE.comp._g});
  });
  wes(NOW.top,{at:.7,gain:.07,dur:1.8,dest:p._g});
}
function sClose(){
  felt(NOW.g[1],{gain:.045,dur:2.2,cut:1600});
  felt(NOW.g[0],{at:.12,gain:.04,dur:2.4,cut:1500});
}
function sBtn(){tick({f:320,gain:.03});}
function sBoot(){
  const order=['bass','comp','perc','pad','answer','bell'];
  const when=[0,.34,.62,.9,1.18,1.46];
  order.forEach(function(role,i){
    setTimeout(function(){
      BYROLE[role].appearT=0;BYROLE[role].flash=1;
    },when[i]*1000+700);
  });
}

/* ============ ORBITE / PICKING ============ */
let az=0.5,pol=1.42,dist=27,tAz=0.5,tPol=1.42,tDist=27,prevAz=0.5,prevPol=1.42,prevDist=27;
let dragging=false,px=0,py=0,movedPx=0;
const target=new THREE.Vector3(0,0,0),tTarget=new THREE.Vector3(0,0,0);
cvs.addEventListener('pointerdown',function(e){
  dragging=true;px=e.clientX;py=e.clientY;movedPx=0;
  cur.classList.add('dn');
  if(booted)sGrab();
});
addEventListener('pointermove',function(e){
  curX=e.clientX;curY=e.clientY;
  if(dragging){
    const dx=e.clientX-px,dy=e.clientY-py;
    movedPx+=Math.abs(dx)+Math.abs(dy);
    tAz-=dx*0.005;tPol=Math.max(0.35,Math.min(2.75,tPol-dy*0.005));
    px=e.clientX;py=e.clientY;
  }else{mx=e.clientX;my=e.clientY;wantHover=true;}
});
addEventListener('pointerup',function(e){
  cur.classList.remove('dn');
  if(dragging){
    if(movedPx<6)pickAt(e.clientX,e.clientY);
    else if(booted)sRelease(Math.abs(tAz-prevAz)+Math.abs(tPol-prevPol));
  }
  dragging=false;
});
addEventListener('wheel',function(e){
  tDist=Math.max(9,Math.min(46,tDist+e.deltaY*0.02));
},{passive:true});
let pinch=0;
addEventListener('touchmove',function(e){
  if(e.touches.length!==2)return;
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                     e.touches[0].clientY-e.touches[1].clientY);
  if(pinch)tDist=Math.max(9,Math.min(46,tDist+(pinch-d)*0.05));
  pinch=d;
},{passive:true});
addEventListener('touchend',function(){pinch=0;});

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let sel=null,hoverP=null,mx=0,my=0,wantHover=false,hoverClock=0;
const cur=document.getElementById('cur');
let curX=innerWidth/2,curY=innerHeight/2;
function rayHit(x,y){
  ndc.x=(x/innerWidth)*2-1;ndc.y=-(y/innerHeight)*2+1;
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickable,false);
  return hits.length?hits[0].object.userData.piece:null;
}
function pickAt(x,y){const p=rayHit(x,y);if(p)select(p);else if(sel)deselect();}
const card=document.getElementById('card'),plate=card.querySelector('.plate'),
      cH=card.querySelector('.plate h2'),cYr=card.querySelector('.plate .yr'),
      cS=card.querySelector('.snd'),cP=card.querySelector('p'),
      cBd=card.querySelector('.bd'),
      cA=card.querySelector('a.cta'),cAB=cA.querySelector('b');
function select(p){
  if(sel===p)return;
  sel=p;if(booted)sSelect(p);
  plate.style.background=p.col;
  cH.textContent=p.name;cYr.textContent=p.yr;

  if(p.yt){

    cA.target=p.href.indexOf('http')===0?'_blank':'';}
  else cA.style.display='none';
  card.classList.add('on');
  const v=p.base.clone();
  tTarget.copy(v.clone().multiplyScalar(0.55));
  tAz=Math.atan2(v.x,v.z);
  tPol=Math.max(0.5,Math.min(2.5,Math.acos(Math.max(-1,Math.min(1,v.y/(v.length()||1))))));
  tDist=15;
}
function deselect(){
  if(!sel)return;
  sel=null;card.classList.remove('on');tTarget.set(0,0,0);tDist=27;

}

/* ============ BOUCLE ============ */
const fwd=new THREE.Vector3(),up=new THREE.Vector3();
const vuI=document.querySelector('#vu i');
let T=0,last=performance.now();
function frame(){
  const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
  T+=RM?0:0.016;
  cur.style.left=curX+'px';cur.style.top=curY+'px';
  prevAz=az;prevPol=pol;prevDist=dist;
  az+=(tAz-az)*0.07;pol+=(tPol-pol)*0.07;dist+=(tDist-dist)*(dist>50?0.022:0.055);
  target.lerp(tTarget,0.05);
  updateMotion(Math.abs(az-prevAz)+Math.abs(pol-prevPol),dist-prevDist);
  const sp=Math.sin(pol);
  camera.position.set(
    target.x+dist*sp*Math.sin(az),
    target.y+dist*Math.cos(pol),
    target.z+dist*sp*Math.cos(az));
  camera.lookAt(target);

  hoverClock++;
  if(wantHover&&!dragging&&hoverClock>4){
    hoverClock=0;wantHover=false;
    const p=rayHit(mx,my);
    if(p!==hoverP){
      hoverP=p;cur.classList.toggle('hot',!!p);
      if(p&&booted)sHover(p);
    }
  }

  PIECE.forEach(function(p){
    if(p.appearT>=0&&p.appear<1){
      p.appearT+=dt;
      p.appear=Math.min(1,p.appearT/0.9);
    }
    const ease=1-Math.pow(1-p.appear,3);
    const b=p.base;
    p.grp.position.set(
      b.x+Math.sin(T*0.35+p.phase)*0.45,
      b.y+Math.sin(T*0.47+p.phase*1.3)*0.5+(1-ease)*-2.5,
      b.z+Math.cos(T*0.29+p.phase)*0.45);
    const look=camera.position.clone().sub(p.grp.position).normalize();
    p.grp.rotation.y+=(Math.atan2(look.x,look.z)-p.grp.rotation.y)*0.06;
    p.grp.rotation.z=Math.sin(T*0.4+p.phase)*0.045;
    p.hover+=((hoverP===p?1:0)-p.hover)*0.14;
    p.flash*=0.955;
    const s=((sel===p?1.13:1)+p.hover*0.05+p.flash*0.045)*ease;
    p.grp.scale.x+=(s-p.grp.scale.x)*0.11;
    p.grp.scale.y=p.grp.scale.z=Math.max(.0001,p.grp.scale.x);
    p.mesh.material.opacity=((sel&&sel!==p?0.55:1)*(0.88+p.hover*0.08+p.flash*0.12))*ease;
    p.lab.material.opacity=(sel&&sel!==p?0.3:(0.75+p.hover*0.25))*ease;
    if(p._send&&AC)p._send.gain.setTargetAtTime(sel===p?.18:.3,AC.currentTime,.3);
    if(p._pan){
      const w=p.grp.position;
      if(p._pan.positionX){
        p._pan.positionX.value=w.x;p._pan.positionY.value=w.y;p._pan.positionZ.value=w.z;
      }else if(p._pan.setPosition)p._pan.setPosition(w.x,w.y,w.z);
    }
  });

  deco.forEach(function(m){
    m.rotation.z+=m.userData.spin;
    m.position.y+=Math.sin(T*0.3+m.userData.bob)*0.004;
    const look=camera.position.clone().sub(m.position).normalize();
    m.rotation.y=Math.atan2(look.x,look.z);
  });

  nextWalker-=dt;
  if(nextWalker<=0){launchWalker();nextWalker=9+Math.random()*15;}
  WALKERS.forEach(function(w){
    const u=w.userData;
    if(!u.active)return;
    u.t+=dt;
    const k=u.t/u.dur;
    if(k>=1){u.active=false;w.material.opacity=0;return;}
    w.position.lerpVectors(u.from,u.to,k);
    w.position.y=u.from.y+Math.sin(k*Math.PI)*.6;
    const fade=Math.min(1,Math.sin(k*Math.PI)*2.2);
    w.material.opacity=fade*u.peak;
    const look=camera.position.clone().sub(w.position).normalize();
    w.rotation.y=Math.atan2(look.x,look.z);
    const fr=Math.floor(u.t*1.55*8)%8;
    if(fr!==u.step){
      u.step=fr;w.material.map=WALK_TEX[fr];w.material.needsUpdate=true;
      if((fr===0||fr===4)&&AC&&eng&&u.g){
        if(u.pan){
          if(u.pan.positionX){
            u.pan.positionX.value=w.position.x;u.pan.positionY.value=w.position.y;
            u.pan.positionZ.value=w.position.z;
          }else if(u.pan.setPosition)u.pan.setPosition(w.position.x,w.position.y,w.position.z);
        }
        footstep(u.g,.05*fade);
      }
    }
  });

  if(AC){
    const L=AC.listener;
    camera.getWorldDirection(fwd);
    up.set(0,1,0).applyQuaternion(camera.quaternion);
    if(L.positionX){
      L.positionX.value=camera.position.x;L.positionY.value=camera.position.y;
      L.positionZ.value=camera.position.z;
      L.forwardX.value=fwd.x;L.forwardY.value=fwd.y;L.forwardZ.value=fwd.z;
      L.upX.value=up.x;L.upY.value=up.y;L.upZ.value=up.z;
    }else if(L.setPosition){
      L.setPosition(camera.position.x,camera.position.y,camera.position.z);
      L.setOrientation(fwd.x,fwd.y,fwd.z,up.x,up.y,up.z);
    }
    mAn.getByteFrequencyData(mBuf);
    let s=0;for(let i=0;i<mBuf.length;i++)s+=mBuf[i];
    vuI.style.width=Math.min(100,(s/mBuf.length)/72*100).toFixed(1)+'%';
  }

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();

}
document.getElementById('enter').addEventListener('click',boot);
gate.addEventListener('click',boot);
addEventListener('keydown',function(e){
  if(!booted&&(e.key==='Enter'||e.key===' ')){e.preventDefault();boot();}
});
document.getElementById('eng').addEventListener('click',function(e){
  e.stopPropagation();
  if(!AC){
    eng=true;
    if(startSound()){e.currentTarget.classList.add('on');}
    else eng=false;
    return;
  }
  eng=!eng;
  e.currentTarget.classList.toggle('on',eng);
  out.gain.setTargetAtTime(eng?.85:0,AC.currentTime,.25);
  document.getElementById('score').style.opacity=eng?'1':'0';
});
document.querySelector('.tr a').addEventListener('mouseenter',function(){if(AC&&eng)sBtn();});
})();
</script>
</body>
</html>
