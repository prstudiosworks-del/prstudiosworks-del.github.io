<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PRSTUDIOS — Philéas Renoult</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--void:#0A0910;--cream:#F2EAD6;--fat:'Archivo Black','Arial Black',sans-serif;
      --mono:'Space Mono',ui-monospace,Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--void);color:var(--cream);font-family:var(--mono);
 -webkit-font-smoothing:antialiased;touch-action:none;cursor:grab}
body.drag{cursor:grabbing}
body.hot{cursor:pointer}
#gl{position:fixed;inset:0;display:block}
::selection{background:var(--cream);color:var(--void)}

/* grain + vignette : la texture de la salle */
#grain{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.28;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
#vig{position:fixed;inset:0;z-index:6;pointer-events:none;
 background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 34%,rgba(0,0,0,.62) 100%)}

#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud>*{position:absolute}
.tl{left:16px;top:14px}
.tl .nm{font-family:var(--fat);font-size:clamp(13px,1.8vw,17px);letter-spacing:-.02em}
.tl .sb{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(242,234,214,.5);margin-top:5px}
.tr{right:16px;top:14px;display:flex;gap:6px;pointer-events:auto;align-items:center}
.tr a,.tr button{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
 padding:6px 11px;border:1px solid rgba(242,234,214,.34);background:none;color:var(--cream);
 text-decoration:none;cursor:pointer}
.tr a:hover,.tr button:hover{background:var(--cream);color:var(--void)}
.tr button.on{border-color:#D8FF3A;color:#D8FF3A}
.bl{left:16px;bottom:15px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
 color:rgba(242,234,214,.4);line-height:1.8;transition:opacity .9s}
.br{right:16px;bottom:15px;font-size:8.5px;letter-spacing:.1em;color:rgba(242,234,214,.32);
 text-align:right;line-height:1.7}
#vu{position:fixed;right:16px;bottom:44px;z-index:11;width:74px;height:3px;
 background:rgba(242,234,214,.14);pointer-events:none}
#vu i{position:absolute;left:0;top:0;bottom:0;width:0;background:#D8FF3A}

#card{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px;
 transform:translateY(102%);transition:transform .55s cubic-bezier(.2,.9,.25,1);pointer-events:none}
#card.on{transform:none;pointer-events:auto}
#card .in{max-width:660px;margin:0 auto;background:rgba(10,9,16,.94);border:1.5px solid;
 padding:17px 18px 18px;display:flex;gap:16px;align-items:flex-start}
#card .txt{flex:1;min-width:0}
#card .yr{font-size:9px;letter-spacing:.17em;text-transform:uppercase;opacity:.72}
#card h2{font-family:var(--fat);font-size:clamp(18px,2.6vw,26px);line-height:1.02;
 letter-spacing:-.03em;margin:6px 0 0}
#card .snd{font-size:9px;letter-spacing:.1em;margin-top:7px;opacity:.9}
#card p{font-size:11.5px;line-height:1.6;margin-top:9px;color:rgba(242,234,214,.85)}
#card img{width:154px;flex:0 0 auto;aspect-ratio:16/9;object-fit:cover;display:block;
 filter:contrast(1.1) saturate(1.05)}
#card .row{display:flex;gap:7px;margin-top:12px;align-items:center}
#card a.cta{font-size:9px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;
 padding:8px 14px;background:currentColor}
#card a.cta b{color:var(--void)}
#card .x{margin-left:auto;font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:none;
 border:1px solid rgba(242,234,214,.4);color:var(--cream);padding:7px 11px;cursor:pointer}
#card .x:hover{background:var(--cream);color:var(--void)}

#gate{position:fixed;inset:0;z-index:60;background:var(--void);display:grid;place-items:center;
 text-align:center;padding:24px;cursor:pointer}
#gate.gone{opacity:0;pointer-events:none;transition:opacity .9s}
#gate .in{max-width:28ch}
#gate h1{font-family:var(--fat);font-size:clamp(28px,6.2vw,56px);line-height:.98;letter-spacing:-.04em}
#gate h1 em{font-style:normal;color:#E8721A}
#gate .sb{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;line-height:1.9;
 color:rgba(242,234,214,.6);margin-top:16px}
#gate .b{display:inline-block;margin-top:24px;font-family:var(--fat);font-size:12px;
 background:var(--cream);color:var(--void);padding:11px 26px}
#gate .b:hover{background:#D8FF3A}
@media(max-width:640px){
  #card .in{flex-direction:column}
  #card img{width:100%}
  .br,#vu{display:none}
}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="grain"></div>
<div id="vig"></div>

<div id="hud">
  <div class="tl"><div class="nm">PRSTUDIOS</div>
    <div class="sb">Philéas Renoult · score &amp; sound design</div></div>
  <div class="tr">
    <a href="mailto:prstudios.works@gmail.com">Hire</a>
    <button id="eng" class="on">Engine</button>
  </div>
  <div class="bl" id="hint">drag to orbit · the mix turns with you<br>hover a piece to hear it · tap to open</div>
  <div class="br" id="sys">—</div>
</div>
<div id="vu"><i></i></div>

<div id="card"><div class="in">
  <div class="txt">
    <div class="yr"></div><h2></h2><div class="snd"></div><p></p>
    <div class="row"><a class="cta" target="_blank" rel="noopener"><b></b></a>
    <button class="x" type="button">Close</button></div>
  </div>
</div></div>

<div id="gate"><div class="in">
  <h1>A room full of <em>pieces</em></h1>
  <div class="sb">orbit it · everything you hear<br>is coming from somewhere</div>
  <div class="b">STEP IN</div>
</div></div>

<script>
(function(){
"use strict";
if(!window.THREE){document.getElementById('gate').innerHTML=
  '<div class="in"><h1>WebGL failed to load</h1></div>';return;}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

const K={void:'#0A0910',cream:'#F2EAD6',rust:'#B7291B',orange:'#E8721A',coral:'#E4795A',
        olive:'#A9A340',teal:'#2C7383',navy:'#22346B',amber:'#E3A72A',ice:'#BFD3D8',
        acid:'#D8FF3A',red:'#E02010',pink:'#E8386E',cyan:'#3BB8D8'};

function rnd(s){let x=s*9301+49297;return function(){x=(x*9301+49297)%233280;return x/233280;};}
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c;}
function tex(c){const t=new THREE.CanvasTexture(c);t.anisotropy=4;t.needsUpdate=true;return t;}
function pick1(a){return a[Math.floor(Math.random()*a.length)];}

/* ============ TEXTURES DU MOODBOARD ============ */
function starPts(g,pts,ro,ri,rot,cx,cy){
  g.beginPath();
  for(let i=0;i<pts*2;i++){
    const r=i%2?ri:ro,a=(i/(pts*2))*6.283+rot;
    const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
    if(i)g.lineTo(px,py);else g.moveTo(px,py);
  }
  g.closePath();
}
function texStar(pts,ro,ri,fill,edge,dot){
  const S=512,c=cnv(S),g=c.getContext('2d');
  g.clearRect(0,0,S,S);
  starPts(g,pts,ro*S/100,ri*S/100,-0.35,S/2,S/2);
  g.lineJoin='round';g.lineWidth=S*0.055;g.strokeStyle=edge;g.stroke();
  g.fillStyle=fill;g.fill();
  if(dot){g.beginPath();g.arc(S/2,S/2,S*0.09,0,6.283);g.fillStyle=dot;g.fill();}
  g.globalAlpha=.08;g.fillStyle='#000';
  const r=rnd(9);for(let i=0;i<900;i++)g.fillRect(r()*S,r()*S,2,2);
  return tex(c);
}
function texStripes(seed,cols){
  const S=512,c=cnv(S),g=c.getContext('2d');
  const r=rnd(seed);let y=0;
  g.fillStyle=K.cream;g.fillRect(0,0,S,S);
  while(y<S){
    const t=2+Math.pow(r(),2.1)*26;
    g.fillStyle=cols[Math.floor(r()*cols.length)];
    g.globalAlpha=.72+r()*.28;g.fillRect(0,y,S,t);y+=t+1;
  }
  g.globalAlpha=.07;g.fillStyle='#000';
  for(let i=0;i<1400;i++)g.fillRect(r()*S,r()*S,2,2);
  return tex(c);
}
function texBlock(){
  const S=512,c=cnv(S),g=c.getContext('2d');
  g.fillStyle='#EDEAE2';g.fillRect(0,0,S,S);
  const r=rnd(21);
  for(let y=4;y<S;y+=7)for(let x=4;x<S;x+=7){
    const v=(Math.sin(x*.021)*Math.cos(y*.017)+Math.sin((x+y)*.009))*.5+.5;
    const rad=v*3.3;
    if(rad>.4){g.beginPath();g.arc(x,y,rad,0,6.283);g.fillStyle='#14120F';g.fill();}
  }
  g.fillStyle=K.red;
  g.beginPath();g.moveTo(S*.20,S*.14);g.lineTo(S*.79,S*.19);
  g.lineTo(S*.77,S*.72);g.lineTo(S*.22,S*.69);g.closePath();g.fill();
  g.globalAlpha=.06;g.fillStyle='#000';
  for(let i=0;i<1000;i++)g.fillRect(r()*S,r()*S,2,2);
  return tex(c);
}
/* silhouette de marcheur, paramétrée par la phase du pas */
function drawWalker(g,S,ph,col,soft){
  const cx=S*.46,gr=S*.88,s=S/512;
  const sw=Math.sin(ph),sw2=Math.sin(ph+Math.PI);
  const bob=Math.abs(Math.sin(ph*2))*10*s;
  const hip=gr-150*s-bob,sh=hip-140*s,hd=sh-40*s;
  g.strokeStyle=col;g.fillStyle=col;
  g.lineCap='round';g.lineJoin='round';
  if(soft){g.shadowColor=col;g.shadowBlur=S*0.045;}
  g.lineWidth=44*s;
  g.beginPath();g.moveTo(cx,hip);g.lineTo(cx+30*s,sh);g.stroke();
  g.lineWidth=34*s;
  [sw,sw2].forEach(function(v){
    const kx=cx+v*70*s, ky=gr-72*s-bob*.4;
    const fx=kx+v*46*s, fy=gr-Math.max(0,v)*26*s;
    g.beginPath();g.moveTo(cx,hip);g.lineTo(kx,ky);g.lineTo(fx,fy);g.stroke();
    g.lineWidth=20*s;
    g.beginPath();g.moveTo(fx,fy);g.lineTo(fx+22*s,fy+3*s);g.stroke();
    g.lineWidth=34*s;
  });
  g.lineWidth=24*s;
  [sw2,sw].forEach(function(v){
    const ex=cx+30*s+v*44*s, ey=sh+70*s;
    const hx=ex+v*36*s, hy=ey+56*s;
    g.beginPath();g.moveTo(cx+30*s,sh);g.lineTo(ex,ey);g.lineTo(hx,hy);g.stroke();
  });
  g.beginPath();g.arc(cx+42*s,hd,34*s,0,6.283);g.fill();
  g.lineWidth=14*s;
  g.beginPath();g.moveTo(cx-12*s,hd-24*s);g.lineTo(cx+100*s,hd-30*s);g.stroke();
  g.beginPath();g.ellipse(cx+46*s,hd-46*s,32*s,25*s,-.12,0,6.283);g.fill();
  g.shadowBlur=0;
}
function texWalker(ph,col,soft){
  const S=512,c=cnv(S),g=c.getContext('2d');
  g.clearRect(0,0,S,S);
  drawWalker(g,S,ph===undefined?0:ph,col||'#0C0B0A',soft);
  return tex(c);
}
function texChalk(){
  const S=512,c=cnv(S),g=c.getContext('2d');
  g.fillStyle='#141110';g.fillRect(0,0,S,S);
  const cols=[K.red,K.orange,K.cyan,K.acid,K.pink,K.amber,K.cream],r=rnd(41);
  for(let k=0;k<34;k++){
    const x0=r()*S,y0=r()*S,col=cols[Math.floor(r()*cols.length)];
    const steps=8+Math.floor(r()*14),amp=6+r()*40,len=40+r()*200;
    for(let pass=0;pass<2;pass++){
      g.beginPath();
      for(let i=0;i<=steps;i++){
        const t=i/steps,x=x0+t*len,y=y0+Math.sin(t*8+k)*amp;
        if(i)g.lineTo(x+(Math.random()-.5)*3,y+(Math.random()-.5)*3);else g.moveTo(x,y);
      }
      g.strokeStyle=col;g.globalAlpha=pass?.13:.42;
      g.lineWidth=pass?5:1.9;g.lineCap='round';g.stroke();
    }
  }
  g.globalAlpha=1;
  starPts(g,8,S*.10,S*.035,.3,S*.76,S*.24);g.fillStyle=K.amber;g.fill();
  starPts(g,5,S*.08,S*.03,-.4,S*.22,S*.78);g.fillStyle=K.acid;g.fill();
  return tex(c);
}
function texHalfYellow(){
  const S=512,c=cnv(S),g=c.getContext('2d');
  g.fillStyle='#E8CE1E';g.fillRect(0,0,S,S);
  for(let y=3;y<S;y+=6)for(let x=3;x<S;x+=6){
    const d=Math.hypot(x-S*.5,y-S*.56)/(S*.5);
    const v=Math.max(0,1-d)*(.5+.5*Math.sin(x*.03)*Math.cos(y*.024));
    const rad=v*3.6;
    if(rad>.4){g.beginPath();g.arc(x,y,rad,0,6.283);g.fillStyle='#141008';g.fill();}
  }
  return tex(c);
}
function texLabel(txt,sub,col){
  const W=512,H=140,c=cnv(W,H),g=c.getContext('2d');
  g.clearRect(0,0,W,H);
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle=col;g.font='46px "Archivo Black",sans-serif';
  g.fillText(txt,W/2,H*0.38);
  g.fillStyle='rgba(242,234,214,.72)';g.font='20px "Space Mono",monospace';
  g.fillText(sub,W/2,H*0.72);
  return tex(c);
}

/* ============ LE MUR DU FOND — bâton d'huile, couronnes, ratures ============
   Vocabulaire personnel (studio, villes, prises), pas de citation d'œuvre.   */
const WORDS=['SOUND','SCORE','MIX','TAKE 1','TAKE 2','GVA','PARIS','LDN','440Hz',
             'TEMPO','REC','CUE','STEM','ROOM','DRY','WET','PRSTUDIOS','LOOP','BUS'];
function crown(g,x,y,w,col,lw){
  g.strokeStyle=col;g.lineWidth=lw;g.lineJoin='round';g.lineCap='round';
  g.beginPath();
  g.moveTo(x-w,y+w*.55);
  g.lineTo(x-w*.72,y-w*.5);
  g.lineTo(x-w*.34,y+w*.14);
  g.lineTo(x,y-w*.62);
  g.lineTo(x+w*.34,y+w*.14);
  g.lineTo(x+w*.72,y-w*.5);
  g.lineTo(x+w,y+w*.55);
  g.stroke();
}
function scrawlWord(g,x,y,txt,col,size,strike){
  g.save();
  g.translate(x,y);g.rotate((Math.random()-.5)*.18);
  g.font=size+'px "Archivo Black",sans-serif';
  g.textAlign='left';g.textBaseline='alphabetic';
  g.fillStyle=col;g.globalAlpha=.85;
  g.fillText(txt,0,0);
  const w=g.measureText(txt).width;
  if(strike){
    g.strokeStyle=col;g.lineWidth=size*.13;g.globalAlpha=.75;
    g.beginPath();
    g.moveTo(-size*.1,-size*.32+(Math.random()-.5)*4);
    g.lineTo(w+size*.1,-size*.3+(Math.random()-.5)*4);
    g.stroke();
  }
  g.restore();
}
function drips(g,x,y,w,col,n){
  g.strokeStyle=col;g.lineCap='round';
  for(let i=0;i<n;i++){
    const dx=x+(Math.random()-.5)*w;
    g.lineWidth=1+Math.random()*3;
    g.globalAlpha=.5;
    g.beginPath();g.moveTo(dx,y);g.lineTo(dx+(Math.random()-.5)*6,y+8+Math.random()*46);g.stroke();
  }
  g.globalAlpha=1;
}
function texWall(seed){
  const S=1024,c=cnv(S),g=c.getContext('2d');
  const r=rnd(seed);
  /* fond : couches de bâton d'huile grattées */
  g.fillStyle='#100E12';g.fillRect(0,0,S,S);
  const smear=[K.rust,K.navy,K.teal,'#2A1810','#1A1D33'];
  for(let i=0;i<26;i++){
    g.globalAlpha=.16+r()*.2;
    g.fillStyle=smear[Math.floor(r()*smear.length)];
    const w=S*(.12+r()*.4),h=S*(.06+r()*.22);
    g.save();g.translate(r()*S,r()*S);g.rotate((r()-.5)*.5);
    g.fillRect(-w/2,-h/2,w,h);g.restore();
  }
  g.globalAlpha=1;

  /* hachures denses */
  for(let k=0;k<9;k++){
    const x0=r()*S,y0=r()*S,col=pick1([K.cream,K.acid,K.coral,K.cyan]);
    g.strokeStyle=col;g.globalAlpha=.2+r()*.22;g.lineWidth=1.3+r()*1.6;
    const n=10+Math.floor(r()*18),len=30+r()*140,gap=4+r()*7;
    for(let i=0;i<n;i++){
      g.beginPath();
      g.moveTo(x0+i*gap,y0);
      g.lineTo(x0+i*gap+(r()-.5)*14,y0+len);
      g.stroke();
    }
  }
  g.globalAlpha=1;

  /* couronnes */
  for(let i=0;i<4;i++){
    const x=S*(.1+r()*.8),y=S*(.1+r()*.8),w=26+r()*54;
    crown(g,x,y,w,pick1([K.amber,K.acid,K.cream]),3+r()*3);
    if(r()<.5)drips(g,x,y+w*.6,w*1.6,K.amber,3);
  }

  /* mots encadrés / rayés */
  for(let i=0;i<11;i++){
    const x=S*(.05+r()*.8),y=S*(.12+r()*.8),sz=17+r()*34;
    const col=pick1([K.cream,K.acid,K.coral,K.cyan,K.amber]);
    scrawlWord(g,x,y,pick1(WORDS),col,sz,r()<.45);
    if(r()<.32){
      g.strokeStyle=col;g.globalAlpha=.4;g.lineWidth=2;
      g.strokeRect(x-8,y-sz,sz*4.2,sz*1.45);g.globalAlpha=1;
    }
  }

  /* têtes / masques au trait */
  for(let i=0;i<3;i++){
    const x=S*(.1+r()*.8),y=S*(.1+r()*.8),w=34+r()*46;
    g.strokeStyle=pick1([K.cream,K.coral]);g.lineWidth=2.6;g.globalAlpha=.6;
    g.beginPath();g.ellipse(x,y,w*.62,w,0,0,6.283);g.stroke();
    g.beginPath();g.arc(x-w*.24,y-w*.2,w*.1,0,6.283);g.stroke();
    g.beginPath();g.arc(x+w*.24,y-w*.2,w*.1,0,6.283);g.stroke();
    g.beginPath();g.moveTo(x-w*.3,y+w*.34);
    for(let k=0;k<7;k++)g.lineTo(x-w*.3+k*w*.1,y+w*.34+(k%2?6:-6));
    g.stroke();
    g.globalAlpha=1;
  }

  /* flèches */
  for(let i=0;i<6;i++){
    const x=r()*S,y=r()*S,a=r()*6.283,L=30+r()*90;
    const ex=x+Math.cos(a)*L,ey=y+Math.sin(a)*L;
    g.strokeStyle=pick1([K.acid,K.cream,K.coral]);g.globalAlpha=.5;g.lineWidth=2.4;
    g.beginPath();g.moveTo(x,y);g.lineTo(ex,ey);g.stroke();
    g.beginPath();
    g.moveTo(ex,ey);g.lineTo(ex-Math.cos(a-.4)*13,ey-Math.sin(a-.4)*13);
    g.moveTo(ex,ey);g.lineTo(ex-Math.cos(a+.4)*13,ey-Math.sin(a+.4)*13);
    g.stroke();g.globalAlpha=1;
  }

  /* bâtons de comptage */
  for(let i=0;i<5;i++){
    const x=r()*S,y=r()*S;
    g.strokeStyle=K.cream;g.globalAlpha=.42;g.lineWidth=2;
    for(let k=0;k<4;k++){
      g.beginPath();g.moveTo(x+k*7,y);g.lineTo(x+k*7+2,y+22);g.stroke();
    }
    g.beginPath();g.moveTo(x-3,y+20);g.lineTo(x+26,y+2);g.stroke();
    g.globalAlpha=1;
  }

  /* étoiles du moodboard, éparses */
  for(let i=0;i<5;i++){
    starPts(g,pick1([4,5,8]),18+r()*26,7+r()*10,r()*6,r()*S,r()*S);
    g.fillStyle=pick1([K.amber,K.acid,K.coral,K.ice]);g.globalAlpha=.55;g.fill();g.globalAlpha=1;
  }

  /* grain */
  g.globalAlpha=.09;g.fillStyle='#000';
  for(let i=0;i<5200;i++)g.fillRect(r()*S,r()*S,2,2);
  g.globalAlpha=1;
  return tex(c);
}

let AC=null,out=null,busUI=null,busWorld=null,verbIn=null,eng=true,booted=false;

function noiseBuf(sec){
  const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;

}
function satCurve(k){
  const n=1024,c=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x));}
  return c;
}
function buildAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  NB=noiseBuf(2);
  out=AC.createGain();out.gain.value=0;
  const sat=AC.createWaveShaper();sat.curve=satCurve(1.6);sat.oversample='2x';
  const air=AC.createBiquadFilter();air.type='highshelf';air.frequency.value=7000;air.gain.value=2.4;
  const mud=AC.createBiquadFilter();mud.type='peaking';mud.frequency.value=320;mud.Q.value=.9;mud.gain.value=-2.2;
  const lim=AC.createDynamicsCompressor();
  lim.threshold.value=-8;lim.knee.value=4;lim.ratio.value=12;lim.attack.value=.003;lim.release.value=.18;
  mAn=AC.createAnalyser();mAn.fftSize=256;mAn.smoothingTimeConstant=.72;
  mBuf=new Uint8Array(mAn.frequencyBinCount);
  out.connect(mud);mud.connect(air);air.connect(sat);sat.connect(lim);
  lim.connect(mAn);mAn.connect(AC.destination);
  busUI=AC.createGain();busUI.gain.value=.85;busUI.connect(out);
  busWorld=AC.createGain();busWorld.gain.value=1;busWorld.connect(out);

  verbIn=AC.createGain();verbIn.gain.value=1;
  const dt=[.0431,.0827,.1213,.1657],fb=[.78,.76,.74,.72],cut=[3200,2400,1800,1300],taps=[];
  for(let i=0;i<4;i++){
    const d=AC.createDelay(1);d.delayTime.value=dt[i];
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=cut[i];
    const g=AC.createGain();g.gain.value=fb[i];
    const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=180;
    verbIn.connect(d);d.connect(f);f.connect(hp);hp.connect(g);
    taps.push({d:d,g:g,f:hp});
  }
  for(let i=0;i<4;i++)taps[i].g.connect(taps[(i+1)%4].d);
  const wet=AC.createGain();wet.gain.value=.5;
  taps.forEach(function(t){t.f.connect(wet);});
  wet.connect(out);

  motion.src=AC.createBufferSource();motion.src.buffer=NB;motion.src.loop=true;
  motion.bp=AC.createBiquadFilter();motion.bp.type='bandpass';
  motion.bp.frequency.value=420;motion.bp.Q.value=.7;
  motion.g=AC.createGain();motion.g.gain.value=0;
  motion.src.connect(motion.bp);motion.bp.connect(motion.g);
  motion.g.connect(busUI);motion.g.connect(verbIn);motion.src.start();

  const rs=AC.createBufferSource();rs.buffer=NB;rs.loop=true;
  const rf=AC.createBiquadFilter();rf.type='lowpass';rf.frequency.value=180;rf.Q.value=.4;
  const rg=AC.createGain();rg.gain.value=.05;
  rs.connect(rf);rf.connect(rg);rg.connect(out);rs.start();

  PIECE.forEach(function(p){
    const pan=AC.createPanner();
    pan.panningModel='HRTF';pan.distanceModel='inverse';
    pan.refDistance=6;pan.maxDistance=90;pan.rolloffFactor=1.1;
    const g=AC.createGain();g.gain.value=1;
    const send=AC.createGain();send.gain.value=.34;
    g.connect(pan);pan.connect(busWorld);pan.connect(send);send.connect(verbIn);
    p._g=g;p._pan=pan;p._send=send;
    schedule(p);
  });

  /* une voie par ombre : pas lointains, spatialisés */
  WALKERS.forEach(function(w){
    const pan=AC.createPanner();
    pan.panningModel='HRTF';pan.distanceModel='inverse';
    pan.refDistance=14;pan.maxDistance=120;pan.rolloffFactor=1.4;
    const g=AC.createGain();g.gain.value=1;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;
    g.connect(lp);lp.connect(pan);pan.connect(busWorld);
    const snd=AC.createGain();snd.gain.value=.6;pan.connect(snd);snd.connect(verbIn);
    w.userData.g=g;w.userData.pan=pan;
  });

  out.gain.linearRampToValueAtTime(.9,AC.currentTime+1.4);
  document.getElementById('sys').textContent=
    (AC.sampleRate/1000).toFixed(1)+' kHz · HRTF · 6 src · FDN verb';
}
function env(g,t,a,pk,d){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,pk),t+a);
  g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
}
function pluck(f,o){
  if(!AC||!eng)return;o=o||{};
  const t=AC.currentTime+(o.at||0),dur=o.dur||1.6;
  const d=AC.createDelay(.2);d.delayTime.value=1/f;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=o.damp||3200;
  const fb=AC.createGain();fb.gain.setValueAtTime(o.fb===undefined?.965:o.fb,t);
  fb.gain.linearRampToValueAtTime(0,t+dur);
  const og=AC.createGain();og.gain.value=o.gain||.12;
  d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(og);
  const n=AC.createBufferSource();n.buffer=NB;
  const ng=AC.createGain();
  ng.gain.setValueAtTime(o.pick||1,t);
  ng.gain.exponentialRampToValueAtTime(.001,t+(o.exc||.012));
  n.connect(ng);ng.connect(d);og.connect(o.dest||busUI);
  n.start(t);n.stop(t+.05);
  setTimeout(function(){try{og.disconnect();d.disconnect();lp.disconnect();fb.disconnect();}catch(e){}},(dur+.4)*1000);

  piano:function(p,i2){
    pick1([[2,4,6,9],[0,3,5,8],[1,4,7,10]]).forEach(function(deg,i){
      tine(note(p,deg,i>2?1:0),{at:i*(.05+Math.random()*.05),gain:.085*i2,dur:3.2,cut:2600,dest:p._g});
    });
  },
  about:function(p,i2){
    breath({f0:340,f1:1100,gain:.045*i2,dur:5,dest:p._g});
    [0,2,4,6].forEach(function(deg,i){
      tine(note(p,deg,0),{at:i*.22,gain:.05*i2,dur:5.5,cut:1600,dest:p._g});
    });
  },
  hire:function(p,i2){
    [0,2,4,5].forEach(function(deg,i){
      glass(note(p,deg,i>2?1:0),{at:i*.11,gain:.07*i2,dur:2.8,dest:p._g});
    });
  }
};
function schedule(p){
  const step=function(){
    if(AC&&eng){VOICE[p.voice](p,(sel===p?1.35:(p.hover>.3?1.15:1)));p.flash=1;}
    const r=p.rate,spd=(sel===p?.6:(p.hover>.3?.78:1));
    p._t=setTimeout(step,(r[0]+Math.random()*(r[1]-r[0]))*spd*1000);
  };
  p._t=setTimeout(step,Math.random()*2200);
}

const motion={src:null,bp:null,g:null};
function updateMotion(spin,zoomV){
  if(!AC||!motion.g)return;
  const t=AC.currentTime;
  motion.g.gain.setTargetAtTime(eng?Math.min(.11,spin*2.6+Math.abs(zoomV)*.09):0,t,.09);
  motion.bp.frequency.setTargetAtTime(300+spin*2600+Math.abs(zoomV)*220,t,.12);
  motion.bp.Q.setTargetAtTime(.6+spin*3,t,.15);
}
function sGrab(){wood({f:135,gain:.11});}
function sRelease(spin){wood({f:105,gain:.06});if(spin>.02)breath({f0:900,f1:260,gain:.035,dur:.5});}
function sHover(p){
  tick({f:5200,q:2,gain:.035,dur:.02});
  const d=p._g||busUI;
  if(p.voice==='elden')metal(note(p,0),{gain:.03,dur:2.2,cut:1400,dest:d});
  else if(p.voice==='bang')pluck(note(p,4,1),{gain:.05,dur:.5,damp:5000,fb:.9,dest:d});
  else if(p.voice==='mail')mallet(note(p,2),{gain:.045,dur:.5,dest:d});
  else if(p.voice==='piano')tine(note(p,4),{gain:.045,dur:1.6,cut:2800,dest:d});
  else if(p.voice==='about')breath({f0:700,f1:1500,gain:.03,dur:1.2,dest:d});
  else glass(note(p,4),{gain:.04,dur:1.4,dest:d});
}
function sSelect(p){
  tick({f:1800,q:1.2,gain:.07,dur:.05});
  breath({f0:2200,f1:400,gain:.05,dur:.9});
  VOICE[p.voice](p,1.5);
}
function sClose(){
  tick({f:900,q:1,gain:.055,dur:.04});
  if(!AC||!eng)return;
  const t=AC.currentTime;
  const osc=AC.createOscillator();osc.type='sine';
  osc.frequency.setValueAtTime(520,t);
  osc.frequency.exponentialRampToValueAtTime(180,t+.18);
  const g=AC.createGain();env(g,t,.004,.05,.22);
  osc.connect(g);g.connect(busUI);osc.start(t);osc.stop(t+.4);
}
function sBtn(){tick({f:3200,q:4,gain:.06,dur:.025});}
function sBoot(){
  breath({f0:120,f1:2600,gain:.09,dur:2.6});
  sub(41,{gain:.12,dur:3.4});
  [0,2,4,6].forEach(function(d,i){
    tine(110*Math.pow(2,[0,3,7,10][i]/12),{at:.35+i*.14,gain:.07,dur:4.4,cut:2400});
  });
}

/* ============ ORBITE / PICKING ============ */
let az=0.5,pol=1.42,dist=27,tAz=0.5,tPol=1.42,tDist=27,prevAz=0.5,prevPol=1.42,prevDist=27;
let dragging=false,px=0,py=0,movedPx=0;
const target=new THREE.Vector3(0,0,0),tTarget=new THREE.Vector3(0,0,0);
cvs.addEventListener('pointerdown',function(e){
  dragging=true;px=e.clientX;py=e.clientY;movedPx=0;
  document.body.classList.add('drag');if(booted)sGrab();
});
addEventListener('pointermove',function(e){
  if(dragging){
    const dx=e.clientX-px,dy=e.clientY-py;
    movedPx+=Math.abs(dx)+Math.abs(dy);
    tAz-=dx*0.005;tPol=Math.max(0.35,Math.min(2.75,tPol-dy*0.005));
    px=e.clientX;py=e.clientY;
  }else{mx=e.clientX;my=e.clientY;wantHover=true;}
});
addEventListener('pointerup',function(e){
  if(dragging){
    if(movedPx<6)pickAt(e.clientX,e.clientY);
    else if(booted)sRelease(Math.abs(tAz-prevAz)+Math.abs(tPol-prevPol));
  }
  dragging=false;document.body.classList.remove('drag');
});
addEventListener('wheel',function(e){
  tDist=Math.max(9,Math.min(46,tDist+e.deltaY*0.02));
},{passive:true});
let pinch=0;
addEventListener('touchmove',function(e){
  if(e.touches.length!==2)return;
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                     e.touches[0].clientY-e.touches[1].clientY);
  if(pinch)tDist=Math.max(9,Math.min(46,tDist+(pinch-d)*0.05));
  pinch=d;
},{passive:true});
addEventListener('touchend',function(){pinch=0;});

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let sel=null,hoverP=null,mx=0,my=0,wantHover=false,hoverClock=0;
function rayHit(x,y){
  ndc.x=(x/innerWidth)*2-1;ndc.y=-(y/innerHeight)*2+1;
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickable,false);
  return hits.length?hits[0].object.userData.piece:null;
}
function pickAt(x,y){const p=rayHit(x,y);if(p)select(p);else if(sel)deselect();}
const card=document.getElementById('card'),cIn=card.querySelector('.in'),
      cYr=card.querySelector('.yr'),cH=card.querySelector('h2'),cS=card.querySelector('.snd'),
      cP=card.querySelector('p'),cA=card.querySelector('a.cta'),cAB=cA.querySelector('b');
function select(p){
  if(sel===p)return;
  sel=p;if(booted)sSelect(p);
  cIn.style.borderColor=p.col;cIn.style.color=p.col;
  cYr.textContent=p.yr;cH.textContent=p.name;
  cS.textContent='◉ '+p.snd;cS.style.color=p.col;
  cP.innerHTML=p.desc;
  const old=cIn.querySelector('img');if(old)old.remove();
  if(p.yt){
    const im=document.createElement('img');
    im.loading='lazy';im.referrerPolicy='no-referrer';im.alt='';
    im.src='https://i.ytimg.com/vi/'+p.yt+'/hqdefault.jpg';
    cIn.appendChild(im);
  }
  if(p.href){cA.style.display='';cA.href=p.href;cAB.textContent=p.cta+' \u2197';
    cA.target=p.href.indexOf('http')===0?'_blank':'';}
  else cA.style.display='none';
  card.classList.add('on');
  const v=p.base.clone();
  tTarget.copy(v.clone().multiplyScalar(0.55));
  tAz=Math.atan2(v.x,v.z);
  tPol=Math.max(0.5,Math.min(2.5,Math.acos(Math.max(-1,Math.min(1,v.y/(v.length()||1))))));
  tDist=15;
}
function deselect(){
  if(!sel)return;
  sel=null;card.classList.remove('on');tTarget.set(0,0,0);tDist=27;
  if(booted)sClose();
}
card.querySelector('.x').addEventListener('click',function(e){e.stopPropagation();deselect();});
addEventListener('keydown',function(e){if(e.key==='Escape')deselect();});

/* ============ BOUCLE ============ */
const fwd=new THREE.Vector3(),up=new THREE.Vector3();
const vuI=document.querySelector('#vu i');
let T=0,last=performance.now();
function frame(){
  const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
  T+=RM?0:0.016;

  prevAz=az;prevPol=pol;prevDist=dist;
  az+=(tAz-az)*0.07;pol+=(tPol-pol)*0.07;dist+=(tDist-dist)*0.055;
  target.lerp(tTarget,0.05);
  updateMotion(Math.abs(az-prevAz)+Math.abs(pol-prevPol),dist-prevDist);

  const sp=Math.sin(pol);
  camera.position.set(
    target.x+dist*sp*Math.sin(az),
    target.y+dist*Math.cos(pol),
    target.z+dist*sp*Math.cos(az));
  camera.lookAt(target);

  hoverClock++;
  if(wantHover&&!dragging&&hoverClock>4){
    hoverClock=0;wantHover=false;
    const p=rayHit(mx,my);
    if(p!==hoverP){
      hoverP=p;document.body.classList.toggle('hot',!!p);
      if(p&&booted)sHover(p);
    }
  }

  PIECE.forEach(function(p){
    const b=p.base;
    p.grp.position.set(
      b.x+Math.sin(T*0.35+p.phase)*0.45,
      b.y+Math.sin(T*0.47+p.phase*1.3)*0.5,
      b.z+Math.cos(T*0.29+p.phase)*0.45);
    const look=camera.position.clone().sub(p.grp.position).normalize();
    p.grp.rotation.y+=(Math.atan2(look.x,look.z)-p.grp.rotation.y)*0.06;
    p.grp.rotation.z=Math.sin(T*0.4+p.phase)*0.045;
    p.hover+=((hoverP===p?1:0)-p.hover)*0.14;
    p.flash*=0.93;
    const s=(sel===p?1.13:1)+p.hover*0.05+p.flash*0.035;
    p.grp.scale.x+=(s-p.grp.scale.x)*0.09;
    p.grp.scale.y=p.grp.scale.z=p.grp.scale.x;
    p.mesh.material.opacity=(sel&&sel!==p?0.55:1)*(0.9+p.hover*0.1+p.flash*0.1);
    p.lab.material.opacity=sel&&sel!==p?0.3:(0.75+p.hover*0.25);
    if(p._send&&AC)p._send.gain.setTargetAtTime(sel===p?.2:.34,AC.currentTime,.3);
    if(p._pan){
      const w=p.grp.position;
      if(p._pan.positionX){
        p._pan.positionX.value=w.x;p._pan.positionY.value=w.y;p._pan.positionZ.value=w.z;
      }else if(p._pan.setPosition)p._pan.setPosition(w.x,w.y,w.z);
    }
  });

  deco.forEach(function(m){
    m.rotation.z+=m.userData.spin;
    m.position.y+=Math.sin(T*0.3+m.userData.bob)*0.004;
    const look=camera.position.clone().sub(m.position).normalize();
    m.rotation.y=Math.atan2(look.x,look.z);
  });

  /* ---- les ombres qui passent ---- */
  nextWalker-=dt;
  if(nextWalker<=0){launchWalker();nextWalker=9+Math.random()*15;}
  WALKERS.forEach(function(w){
    const u=w.userData;
    if(!u.active)return;
    u.t+=dt;
    const k=u.t/u.dur;
    if(k>=1){u.active=false;w.material.opacity=0;return;}
    w.position.lerpVectors(u.from,u.to,k);
    w.position.y=u.from.y+Math.sin(k*Math.PI)*.6;
    /* fondu d'entrée / sortie : elle sort du noir et y retourne */
    const fade=Math.min(1,Math.sin(k*Math.PI)*2.2);
    w.material.opacity=fade*u.peak;
    const look=camera.position.clone().sub(w.position).normalize();
    w.rotation.y=Math.atan2(look.x,look.z);
    /* cycle de marche */
    const cyc=u.t*1.55;
    const fr=Math.floor(cyc*8)%8;
    if(fr!==u.step){
      u.step=fr;w.material.map=WALK_TEX[fr];w.material.needsUpdate=true;
      if((fr===0||fr===4)&&AC&&eng&&u.g){
        if(u.pan){
          if(u.pan.positionX){
            u.pan.positionX.value=w.position.x;u.pan.positionY.value=w.position.y;
            u.pan.positionZ.value=w.position.z;
          }else if(u.pan.setPosition)u.pan.setPosition(w.position.x,w.position.y,w.position.z);
        }
        footstep(u.g,.055*fade);
      }
    }
  });

  if(AC){
    const L=AC.listener;
    camera.getWorldDirection(fwd);
    up.set(0,1,0).applyQuaternion(camera.quaternion);
    if(L.positionX){
      L.positionX.value=camera.position.x;L.positionY.value=camera.position.y;
      L.positionZ.value=camera.position.z;
      L.forwardX.value=fwd.x;L.forwardY.value=fwd.y;L.forwardZ.value=fwd.z;
      L.upX.value=up.x;L.upY.value=up.y;L.upZ.value=up.z;
    }else if(L.setPosition){
      L.setPosition(camera.position.x,camera.position.y,camera.position.z);
      L.setOrientation(fwd.x,fwd.y,fwd.z,up.x,up.y,up.z);
    }
    mAn.getByteFrequencyData(mBuf);
    let s=0;for(let i=0;i<mBuf.length;i++)s+=mBuf[i];
    vuI.style.width=Math.min(100,(s/mBuf.length)/72*100).toFixed(1)+'%';
  }

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const gate=document.getElementById('gate'),hint=document.getElementById('hint');
function boot(){
  if(booted)return;booted=true;
  try{buildAudio();sBoot();}catch(e){eng=false;}
  gate.classList.add('gone');
  setTimeout(function(){gate.remove();},1000);
  setTimeout(function(){hint.style.opacity='.25';},9000);
  nextWalker=4;
}
gate.addEventListener('click',boot);
addEventListener('keydown',function(e){
  if(!booted&&(e.key==='Enter'||e.key===' ')){e.preventDefault();boot();}
});
document.getElementById('eng').addEventListener('click',function(e){
  e.stopPropagation();eng=!eng;
  e.currentTarget.classList.toggle('on',eng);
  if(AC){out.gain.setTargetAtTime(eng?.9:0,AC.currentTime,.05);if(eng)sBtn();}
});
document.querySelector('.tr a').addEventListener('mouseenter',function(){if(booted)sBtn();});
document.getElementById('eng').addEventListener('mouseenter',function(){if(booted)sBtn();});
})();
</script>
